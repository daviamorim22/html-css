<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela ex</title>
    <style>
         body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 300px;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3</td>
            <td>4</td>
            <td rowspan="2">7</td>
        </tr>
    
        <tr>
            <td>5</td>
            <td>6</td>
            <td>8</td>
        </tr>
    
        <tr>
            <td colspan="3">9</td>
            <td colspan="2">10</td>
        </tr>
    
        <tr>
            <td rowspan="2">11</td>
            <td colspan="3">12</td>
            <td>13</td>
        </tr>
    
        <tr>
            <td>14</td>
            <td>15</td>
        </tr>
    </table>
    
</body>
</html>
