<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Exercicio</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        thead {
            background-color: darkcyan;
            color: white;
        }

        tfoot {
            background-color: darkcyan;
            color: white;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;

        }
    </style>
</head>
<body>
    <h1>Tabela e Preços</h1>
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mouse</td>
                <td>R$50</td>
                <td>2 unidades</td>
            </tr>
            <tr>
                <td>Teclado</td>
                <td>R$120</td>
                <td>1 unidade</td>
            </tr>
            <tr>
                <td>Monitor</td>
                <td>R$900</td>
                <td>1 unidade</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <Td>Valor Total</Td>
                <th colspan="2">R$1.120</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
